data:
  # FILL THESE IN. Both are machine-specific; see configs/paths.yaml for what
  # they are and where the canonical copies live on the lab server, or set the
  # CU_MANIFEST_PATH / CU_IMAGE_ROOT env vars and leave these empty.
  #
  #   manifest_path -> the sequence manifest CSV (one row per 10-frame sequence)
  #   image_root    -> <image_root>/<sequence_id>/frame_XXXX.png
  #
  # Run `python scripts/_paths.py` to check your configuration.
  manifest_path: ""
  image_root: ""
  split: "test"
  max_sequences: 100
  frames_per_sequence: 10
  categories:
    - Geometric
    - Semantic
    - Compositional

sequence:
  id_column: "sequence_id"
  frame_index_column: "frame_index"
  image_path_column: "image_path"
  question_column: "question"
  category_column: "category"
  max_ambiguity_column: "max_ambiguity_index"
  ground_truth_column: "ground_truth"
